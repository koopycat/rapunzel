name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          shellcheck \
            bootstrap.sh \
            lib/volumes.sh \
            pi-docker-shell \
            pi-ext \
            pi-project \
            openshell/pi-openshell \
            openshell/setup-provider \
            openshell/test.sh \
            setup-identity.sh \
            test.sh \
            verify-isolation-inner.sh \
            verify-isolation.sh

      - name: Validate bootstrap config script
        run: node --check bootstrap-config.mjs

      - name: Validate OpenShell blueprint
        run: ./openshell/test.sh

      - name: Build images
        run: |
          docker build --pull -t pi-project-sandbox .
          docker build -t pi-openshell:local -f openshell/Dockerfile .

      - name: Offline smoke test
        run: ./test.sh

      - name: Isolation check
        run: ./verify-isolation.sh .